<div class="workouts-page">

    <div class="header-content">
      <h1 class="page-title">Workouts</h1>
      <p class="page-subtitle">Verwalte und verfolge deine täglichen Aktivitäten</p>
    </div>

    <button 
      mat-raised-button 
      color="primary" 
      class="create-button" 
      (click)="openCreateDialog()"

    </button>
  </div>

  <app-workout-list />
</div>
