services:
  postgres:
    image: postgres:16-alpine
    container_name: fitlog_db
    environment:
      POSTGRES_USER: fitlog_user
      POSTGRES_PASSWORD: fitlog_password
      POSTGRES_DB: fitlog_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitlog_user -d fitlog_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    container_name: fitLog-backend
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: fitlog_user
      DB_PASSWORD: fitlog_password
      DB_DATABASE: fitlog_db
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    container_name: fitLog-frontend
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data: