<div class="workouts-page">
  <fitlog-page-header
    title="Workouts"
    subtitle="Verwalte und verfolge deine täglichen Aktivitäten"
  ></fitlog-page-header>

  <fitlog-action-toolbar>
    <fitlog-create-button
      label="Workout erstellen"
      (btnClick)="openCreateDialog()"
    ></fitlog-create-button>
  </fitlog-action-toolbar>

  <fitlog-workout-list
  [workouts]="workoutService.workouts()"
  [loading]="workoutService.isLoading()"
  (edit)="editWorkout($event)"
  (delete)="deleteWorkout($event)"
/>
</div>
